# Gene type definitions for GenBank sequence classification.
# Each key is a gene type identifier; each value is a list of synonym
# phrases that, when found in a Definition field, indicate that gene type.
# All matching is case-insensitive.
#
# Gene types are grouped as:
#   Mitochondrial (default): coi, 16s, 12s, cob, mtgenome, cox3, cox2, nd1-nd6, nd4l, atp6, atp8
#   Nuclear (default): 18-28s, its1-its2, ef-1, 28s, 18s, h3
#   Plastid (default): plastome, rbcl, matk, trnl-trnf, psba-trnh, rpl16, rps16, ndhf, rpoc1, ycf1,
#     rpl32-trnl, trns-trng, atpf-atph, petb-petd, psbe-petl, rbcl-atpb, trnk

