[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g2t"
version = "0.0.2"
description = "GenBank to Taxonomy: download a taxon from NCBI and build a specimen x gene matrix"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Deyuan Yang"},
]
keywords = ["genbank", "taxonomy", "bioinformatics", "gene-classification", "dna-barcoding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.5",
    "biopython>=1.80",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pre-commit"]

[project.urls]
Homepage = "https://github.com/deyuanyang92-dev/gb2taxonomy"
Repository = "https://github.com/deyuanyang92-dev/gb2taxonomy"
"Bug Tracker" = "https://github.com/deyuanyang92-dev/gb2taxonomy/issues"
Changelog = "https://github.com/deyuanyang92-dev/gb2taxonomy/blob/main/CHANGELOG.md"

[project.scripts]
g2t = "g2t._cli:main_pipeline"
g2t-download = "g2t._cli:main_download"
g2t-extract = "g2t._cli:main_extract"
g2t-classify = "g2t._cli:main_classify"
g2t-voucher = "g2t._cli:main_voucher"
g2t-reconcile = "g2t._cli:main_reconcile"
g2t-organize = "g2t._cli:main_organize"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
g2t = ["data/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
