<text x="132" y="437.0" class="mono" xml:space="preserve">                     /db_xref=&quot;taxon:2053924&quot;</text>
<text x="132" y="452.5" class="mono" xml:space="preserve">                     /lat_lon=&quot;8.92983 N 84.312 W&quot;</text>
