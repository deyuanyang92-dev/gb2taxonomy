<text x="132" y="406.0" class="mono" xml:space="preserve">                     /mol_type=&quot;genomic DNA&quot;</text>
<text x="132" y="421.5" class="mono" xml:space="preserve">                     /specimen_voucher=&quot;SIO:BIC:A1758&quot;</text>
