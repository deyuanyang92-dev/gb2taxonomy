<svg viewBox="0 0 900 684" role="img" aria-label="逻辑图：线粒体基因组的测序方法怎样判断（g2t-mitostats）" xmlns="http://www.w3.org/2000/svg" class="dg" width="900" height="684" style="color:#1b2328"><style>
.dg { display: block; width: 100%; min-width: 720px; height: auto; color: #1b2328; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
.dg .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #1b2328; }
.dg .kw { font-weight: 600; }
.dg .t { fill: #1b2328; }
.dg .small { font-size: 11.5px; }
.dg .cap { fill: #5d6a73; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
.dg .lab { fill: #5d6a73; font-size: 11.5px; }
.dg .co { fill: #1b2328; font-size: 12px; }
.dg .chg-t { fill: #b4232c; font-weight: 600; }
.dg .lead { stroke: #5d6a73; stroke-width: .8; stroke-dasharray: 2 3; }
.dg .dot { fill: #5d6a73; } .dg .dot.chg { fill: #b4232c; }
.dg .band { stroke: none; }
.dg .sec { font-weight: 700; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
.dg .b-head { fill: #2f6fb01a; } .dg .bar.b-head { fill: #2f6fb0; } .dg .s-head { fill: #2f6fb0; }
.dg .b-org { fill: #2e8b571a; } .dg .bar.b-org { fill: #2e8b57; } .dg .s-org { fill: #2e8b57; }
.dg .b-ref { fill: #8a5a001a; } .dg .bar.b-ref { fill: #8a5a00; } .dg .s-ref { fill: #8a5a00; }
.dg .b-com { fill: #8e3fa81a; } .dg .bar.b-com { fill: #8e3fa8; } .dg .s-com { fill: #8e3fa8; }
.dg .b-feat { fill: #c2410c1a; } .dg .bar.b-feat { fill: #c2410c; } .dg .s-feat { fill: #c2410c; }
.dg .b-seq { fill: #5d6a731a; } .dg .bar.b-seq { fill: #5d6a73; } .dg .s-seq { fill: #5d6a73; }
.dg .proc { fill: #ffffff; stroke: #1b2328; stroke-width: 1.3; }
.dg .proc.new { fill: #d6efeb; stroke: #0f766e; stroke-width: 1.6; }
.dg .proc.side { stroke-dasharray: 4 3; }
.dg .term { fill: #e7f0ee; stroke: #1b2328; stroke-width: 1.3; }
.dg .dec { fill: #ffffff; stroke: #1b2328; stroke-width: 1.3; }
.dg .doc { fill: #f5f7f8; stroke: #5d6a73; stroke-width: 1; }
.dg .doc.in { fill: #fbedd3; stroke: #9a5b00; }
.dg .db { fill: #ffffff; stroke: #1b2328; stroke-width: 1.3; }
.dg .db-rim { fill: none; stroke: #1b2328; stroke-width: 1.3; }
.dg .ar { fill: none; stroke: #1b2328; stroke-width: 1.3; }
.dg .ahead { fill: #1b2328; }
.dg .out-ok { fill: #e7f0ee; stroke: #5d6a73; stroke-width: 1; }
.dg .out-warn { fill: #fbedd3; stroke: #9a5b00; stroke-width: 1.2; }
.dg .out-chg { fill: #f9dcdc; stroke: #b4232c; stroke-width: 1.4; }

 text{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif} .mono{font-family:Menlo,Consolas,'IBM Plex Mono',monospace}</style><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="ah5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs>
<polygon points="270,38.0 435.0,74 270,110.0 105.0,74" class="dec"/>
<text x="270.0" y="70.2" class="t" text-anchor="middle" font-size="12">有 Assembly-Data</text>
<text x="270.0" y="86.2" class="t" text-anchor="middle" font-size="12">测序技术注释？</text>
<rect x="475.0" y="50.0" width="330.0" height="48.0" rx="6" class="out-ok"/>
<text x="640.0" y="70.2" class="t" text-anchor="middle" font-size="12">按注释：</text>
<text x="640.0" y="86.2" class="t" text-anchor="middle" font-size="12">Sanger / NGS / Long-read</text>
<polyline points="435.0,74.0 475.0,74.0" class="ar" marker-end="url(#ah5)"/>
<text x="442.0" y="67.0" class="lab" text-anchor="start">是</text>
<polyline points="270.0,110.0 270.0,142.0" class="ar" marker-end="url(#ah5)"/>
<text x="278.0" y="130.0" class="lab" text-anchor="start">否</text>
<polygon points="270,142.0 435.0,178 270,214.0 105.0,178" class="dec"/>
<text x="270.0" y="174.2" class="t" text-anchor="middle" font-size="12">COMMENT 自由文本</text>
<text x="270.0" y="190.2" class="t" text-anchor="middle" font-size="12">写了测序平台？</text>
<rect x="475.0" y="154.0" width="330.0" height="48.0" rx="6" class="out-ok"/>
<text x="640.0" y="174.2" class="t" text-anchor="middle" font-size="12">按平台（如 PacBio → Long-read）</text>
<text x="640.0" y="190.2" class="t" text-anchor="middle" font-size="12">“Sanger Institute”不算</text>
<polyline points="435.0,178.0 475.0,178.0" class="ar" marker-end="url(#ah5)"/>
<text x="442.0" y="171.0" class="lab" text-anchor="start">是</text>
<polyline points="270.0,214.0 270.0,246.0" class="ar" marker-end="url(#ah5)"/>
<text x="278.0" y="234.0" class="lab" text-anchor="start">否</text>
<polygon points="270,246.0 435.0,282 270,318.0 105.0,282" class="dec"/>
<text x="270.0" y="278.2" class="t" text-anchor="middle" font-size="12">DBLINK 有 SRA，或</text>
<text x="270.0" y="294.2" class="t" text-anchor="middle" font-size="12">COMMENT 有 SRR 运行号？</text>
<rect x="475.0" y="266.0" width="330.0" height="32.0" rx="6" class="out-ok"/>
<text x="640.0" y="286.2" class="t" text-anchor="middle" font-size="12">NGS</text>
<polyline points="435.0,282.0 475.0,282.0" class="ar" marker-end="url(#ah5)"/>
<text x="442.0" y="275.0" class="lab" text-anchor="start">是</text>
<polyline points="270.0,318.0 270.0,350.0" class="ar" marker-end="url(#ah5)"/>
<text x="278.0" y="338.0" class="lab" text-anchor="start">否</text>
<polygon points="270,350.0 435.0,386 270,422.0 105.0,386" class="dec"/>
<text x="270.0" y="382.2" class="t" text-anchor="middle" font-size="12">论文标题写了</text>
<text x="270.0" y="398.2" class="t" text-anchor="middle" font-size="12">高通量方法？</text>
<rect x="475.0" y="370.0" width="330.0" height="32.0" rx="6" class="out-ok"/>
<text x="640.0" y="390.2" class="t" text-anchor="middle" font-size="12">NGS</text>
<polyline points="435.0,386.0 475.0,386.0" class="ar" marker-end="url(#ah5)"/>
<text x="442.0" y="379.0" class="lab" text-anchor="start">是</text>
<polyline points="270.0,422.0 270.0,454.0" class="ar" marker-end="url(#ah5)"/>
<text x="278.0" y="442.0" class="lab" text-anchor="start">否</text>
<polygon points="270,454.0 435.0,490 270,526.0 105.0,490" class="dec"/>
<text x="270.0" y="486.2" class="t" text-anchor="middle" font-size="12">2012 年以前</text>
<text x="270.0" y="502.2" class="t" text-anchor="middle" font-size="12">首次提交？</text>
<rect x="475.0" y="466.0" width="330.0" height="48.0" rx="6" class="out-warn"/>
<text x="640.0" y="486.2" class="t" text-anchor="middle" font-size="12">Sanger（推断：当时</text>
<text x="640.0" y="502.2" class="t" text-anchor="middle" font-size="12">还没有这个注释）</text>
<polyline points="435.0,490.0 475.0,490.0" class="ar" marker-end="url(#ah5)"/>
<text x="442.0" y="483.0" class="lab" text-anchor="start">是</text>
<polyline points="270.0,526.0 270.0,558.0" class="ar" marker-end="url(#ah5)"/>
<text x="278.0" y="546.0" class="lab" text-anchor="start">否</text>
<rect x="105.0" y="566.0" width="330.0" height="48.0" rx="6" class="out-chg"/>
<text x="270.0" y="586.2" class="t" text-anchor="middle" font-size="12">Unknown：记录里</text>
<text x="270.0" y="602.2" class="t" text-anchor="middle" font-size="12">找不到测序方法</text>
</svg>